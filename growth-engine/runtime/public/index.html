<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growth Engine Approval</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:40px auto;padding:0 16px;line-height:1.4}input,button,textarea{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px}button{padding:9px 14px;margin-right:8px;cursor:pointer}.card{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}.muted{opacity:.7}.ok{font-weight:600}</style></head><body><h1>Growth Engine Approval</h1><p class="muted">Status, manueller Lauf und Freigaben für Zuhause am Bach & Windis.</p><label>Agent-Basis-URL</label><input id="base" placeholder="https://.../agents/growth-runtime/main"><label>ADMIN_TOKEN</label><input id="token" type="password"><button id="status">Status laden</button><button id="run">Jetzt ausführen</button><div id="meta"></div><div id="items"></div><script>const $=id=>document.getElementById(id);const auth=()=>({'Authorization':'Bearer '+$('token').value,'Content-Type':'application/json'});async function req(path,opts={}){const r=await fetch($('base').value.replace(/\/$/,'')+path,{...opts,headers:{...auth(),...(opts.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}function render(s){$('meta').innerHTML='<p><b>Letzter Lauf:</b> '+(s.lastRunAt||'—')+'</p><p><b>Schedule:</b> '+(s.schedule||'—')+'</p><p><b>Warnungen:</b> '+((s.warnings||[]).join(' | ')||'keine')+'</p>';$('items').innerHTML=(s.approvals||[]).map(a=>'<div class="card"><div class="ok">'+a.brand+' · '+a.kind+'</div><p>'+a.task+'</p><textarea id="n-'+a.id+'" placeholder="Notiz optional"></textarea><button onclick="decide(\''+a.id+'\',\'approve\')">Freigeben</button><button onclick="decide(\''+a.id+'\',\'reject\')">Ablehnen</button></div>').join('')||'<p>Keine offenen Freigaben.</p>'}async function load(){render(await req('/status'))}async function decide(id,kind){await req('/'+kind,{method:'POST',body:JSON.stringify({id,note:$('n-'+id).value})});await load()}$('status').onclick=()=>load().catch(e=>alert(e.message));$('run').onclick=async()=>{try{await req('/run-now',{method:'POST'});await load()}catch(e){alert(e.message)}};</script></body></html>
