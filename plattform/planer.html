<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tour planen | Donau & Steig Direkt</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f5ee;color:#17302b}main{max-width:980px;margin:auto;padding:40px 20px}h1{font-size:clamp(36px,7vw,68px);line-height:1;margin-bottom:12px}.box,.day{background:#fff;border:1px solid #d9e1dc;border-radius:16px;padding:20px;margin:16px 0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:800}select,input{width:100%;padding:12px;margin-top:6px;border:1px solid #bbc9c2;border-radius:9px;font-size:16px}button{background:#176b5a;color:#fff;border:0;border-radius:9px;padding:14px 18px;font-weight:900;font-size:16px;cursor:pointer}.badge{display:inline-block;background:#eaf3ee;padding:6px 9px;border-radius:999px;font-weight:800}.stay{padding:12px;background:#eaf3ee;border-radius:10px;margin-top:12px}.muted{color:#61716c;font-size:14px}@media(max-width:650px){.form{grid-template-columns:1fr}}</style></head><body><main><span class="badge">Pilot 2027</span><h1>Deine Leistung. Deine Etappen.</h1><p>Gib an, wie weit du pro Tag gehen möchtest. Wir teilen die Route passend auf und vermitteln an jedem Tagesziel einen geprüften Gastgeber.</p><section class="box"><div class="form"><label>Route<select id="route"><option value="welterbesteig-wachau">Welterbesteig Wachau</option></select></label><label>Tagesleistung<input id="daily" type="number" min="5" max="50" value="18"> km</label><label>Start<select id="start"></select></label><label>Ziel<select id="end"></select></label></div><p><label><input id="luggage" type="checkbox" checked style="width:auto"> Gepäcktransport für die Tour gewünscht</label></p><button id="plan">Gesamte Tour planen →</button></section><div id="result"></div></main><script>let data;fetch('routes.json').then(r=>r.json()).then(d=>{data=d.routes[0];const places=[...new Set(data.segments.flatMap(s=>[s.from,s.to]))];start.innerHTML=places.map(x=>`<option>${x}</option>`).join('');end.innerHTML=places.map(x=>`<option>${x}</option>`).join('');end.value='Melk'});function makePlan(){const km=Math.max(5,+daily.value||18),s=start.value,e=end.value;if(s===e){result.innerHTML='<p>Start und Ziel müssen verschieden sein.</p>';return}const seg=data.segments;let i=seg.findIndex(x=>x.from===s),path=[];if(i<0)return;for(let n=0;n<seg.length;n++){const x=seg[(i+n)%seg.length];path.push(x);if(x.to===e)break}if(path[path.length-1].to!==e){result.innerHTML='<p>Route konnte nicht gebildet werden.</p>';return}let days=[],from=s,dist=0;path.forEach((x,idx)=>{dist+=x.km;const next=path[idx+1];if(dist>=km*.72||!next){days.push({from,to:x.to,km:dist});from=x.to;dist=0}});const luggage=document.getElementById('luggage').checked;result.innerHTML=`<section class="box"><h2>${days.length} Tagesetappen</h2><p>${s} → ${e} · Ziel etwa ${km} km/Tag${luggage?' · Gepäcktransport gewünscht':''}</p></section>`+days.map((d,n)=>`<article class="day"><span class="badge">Tag ${n+1}</span><h2>${d.from} → ${d.to}</h2><p><strong>${d.km.toFixed(1)} km</strong></p>${n<days.length-1?`<div class="stay"><strong>🛏 Übernachtung in/nahe ${d.to}</strong><br>Geprüfte 1-Nacht-Gastgeber werden hier nach Verfügbarkeit vermittelt.${luggage?`<br>🧳 Gepäck: Weitertransport nach ${days[n+1].to} organisieren.`:''}</div>`:'<div class="stay"><strong>✓ Reiseziel erreicht</strong></div>'}</article>`).join('')+`<p class="muted">Pilotberechnung. Vor dem Saisonstart werden Höhenmeter, Gehzeit, reale Wegpunkte, Verfügbarkeit und Gastgeberentfernung in die Optimierung aufgenommen.</p>`}document.getElementById('plan').onclick=makePlan;</script></body></html>
