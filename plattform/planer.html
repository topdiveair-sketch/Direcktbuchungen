<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tour planen | Donau & Steig Direkt</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f5ee;color:#17302b}main{max-width:980px;margin:auto;padding:40px 20px}h1{font-size:clamp(36px,7vw,68px);line-height:1;margin-bottom:12px}.box,.day{background:#fff;border:1px solid #d9e1dc;border-radius:16px;padding:20px;margin:16px 0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:800}select,input{width:100%;padding:12px;margin-top:6px;border:1px solid #bbc9c2;border-radius:9px;font-size:16px}button,.btn{background:#176b5a;color:#fff;border:0;border-radius:9px;padding:14px 18px;font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}.badge{display:inline-block;background:#eaf3ee;padding:6px 9px;border-radius:999px;font-weight:800}.stay{padding:12px;background:#eaf3ee;border-radius:10px;margin-top:12px}.host{margin-top:10px;padding:12px;background:#fff;border:1px solid #c9ddd3;border-radius:9px}.muted{color:#61716c;font-size:14px}.warning{background:#fff3cd;padding:12px;border-radius:9px;margin-top:10px}@media(max-width:650px){.form{grid-template-columns:1fr}}</style></head><body><main><span class="badge">Pilot 2027</span><h1>Deine Leistung. Deine Reise.</h1><p>Du bestimmst Tagesleistung, Start und Ziel. Wir bauen daraus die Etappen und ordnen passende persönlich geführte 1-Nacht-Gastgeber entlang der Route zu.</p><section class="box"><div class="form"><label>Route<select id="route"><option value="welterbesteig-wachau">Welterbesteig Wachau</option></select></label><label>Tagesleistung<input id="daily" type="number" min="5" max="50" value="18"> km</label><label>Start<select id="start"></select></label><label>Ziel<select id="end"></select></label><label>Erster Wandertag<input id="arrival" type="date"></label><label>Max. Abweichung<input id="tolerance" type="number" min="0" max="10" value="4"> km</label></div><p><label><input id="luggage" type="checkbox" checked style="width:auto"> Gepäcktransport für die gesamte Tour gewünscht</label></p><button id="plan">Gesamte Reise planen →</button></section><div id="result"></div></main><script>let data,hosts=[];Promise.all([fetch('routes.json').then(r=>r.json()),fetch('hosts.json').then(r=>r.json())]).then(([r,h])=>{data=r.routes[0];hosts=h.hosts.filter(x=>x.status==='verified'&&x.published&&x.accepting_bookings);const places=[...new Set(data.segments.flatMap(s=>[s.from,s.to]))];start.innerHTML=places.map(x=>`<option>${x}</option>`).join('');end.innerHTML=places.map(x=>`<option>${x}</option>`).join('');end.value='Melk';const d=new Date();d.setDate(d.getDate()+1);arrival.value=d.toISOString().slice(0,10)});function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function datePlus(base,n){if(!base)return'';const d=new Date(base+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('de-AT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}function hostAt(place){return hosts.filter(h=>h.location===place||h.location.includes(place)||place.includes(h.location))}function makePlan(){const target=Math.max(5,+daily.value||18),tol=Math.max(0,+tolerance.value||4),s=start.value,e=end.value;if(!data){return}if(s===e){result.innerHTML='<p class="warning">Start und Ziel müssen verschieden sein.</p>';return}const seg=data.segments;let i=seg.findIndex(x=>x.from===s),path=[];if(i<0)return;for(let n=0;n<seg.length;n++){const x=seg[(i+n)%seg.length];path.push(x);if(x.to===e)break}if(path[path.length-1].to!==e){result.innerHTML='<p class="warning">Route konnte nicht gebildet werden.</p>';return}let days=[],from=s,dist=0;path.forEach((x,idx)=>{dist+=x.km;const next=path[idx+1],wouldNext=next?dist+next.km:Infinity;const closeNow=Math.abs(dist-target),closeNext=Math.abs(wouldNext-target);if(!next||dist>=target+tol||(dist>=Math.max(5,target-tol)&&closeNow<=closeNext)){days.push({from,to:x.to,km:dist});from=x.to;dist=0}});const lug=luggage.checked;base=arrival.value;result.innerHTML=`<section class="box"><h2>${days.length} Tagesetappen</h2><p><strong>${esc(s)} → ${esc(e)}</strong> · Ziel ${target} km/Tag · Toleranz ±${tol} km${lug?' · 🧳 Gepäckservice':''}</p></section>`+days.map((d,n)=>{const hs=hostAt(d.to),overnight=n<days.length-1;let stay='';if(overnight){stay=`<div class="stay"><strong>🛏 Übernachtung ${datePlus(base,n)} in/nahe ${esc(d.to)}</strong>`+(hs.length?hs.map(h=>`<div class="host"><strong>✓ ${esc(h.name)}</strong><br><span class="muted">Geprüft · Direktkontakt · Barzahlung beim Gastgeber</span><br><a class="btn" href="${esc(h.direct_url)}?utm_source=route-planner&utm_medium=platform&utm_campaign=2027&stage=${encodeURIComponent(d.to)}">Direkt anfragen →</a></div>`).join(''):`<div class="warning">Noch kein freigegebener Gastgeber an diesem Etappenziel. Hier suchen wir gezielt einen kleinen 1-Nacht-Betrieb.</div>`)+(lug?`<p>🧳 Gepäckauftrag: Abholung bei diesem Gastgeber und Transport zum nächsten Übernachtungsort.</p>`:'')+`</div>`}else stay='<div class="stay"><strong>✓ Reiseziel erreicht</strong></div>';return `<article class="day"><span class="badge">Tag ${n+1} · ${datePlus(base,n)}</span><h2>${esc(d.from)} → ${esc(d.to)}</h2><p><strong>${d.km.toFixed(1)} km</strong></p>${stay}</article>`}).join('')+`<section class="box"><h2>Was vor Saison 2027 noch automatisch wird</h2><p>Verfügbarkeit pro Nacht, Höhenmeter/Gehzeit, Entfernung Unterkunft–Weg, Alternativgastgeber, Gepäckübergabe und eine gemeinsame Reiseanfrage für alle Etappen.</p><p class="muted">Der Planer bevorzugt passende Etappenziele statt starr die offiziellen Tagesetappen zu übernehmen. Gastgeber werden erst nach Betreiberfreigabe angezeigt.</p></section>`}document.getElementById('plan').onclick=makePlan;</script></body></html>
