  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #5f6f69;
      --line: #d8e2dd;
      --paper: #fbfcf8;
      --panel: #ffffff;
      --brand: #176b5a;
      --brand-2: #9f5f2a;
      --soft: #eef5f0;
      --warn: #fff4df;
      --gold: #f0b424;
    }
    * { box-sizing: border-box; }
    .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5;
    }
    a { color: inherit; }
    .top {
      min-height: 0;
      display: block;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(18,35,25,.88), rgba(18,35,25,.46)),
        url("images/aggsbach-markt-luftbild.webp") center / cover;
      color: #fff;
    }
    .nav {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      padding: 18px min(5vw, 56px);
    }
    .top-image {
      display: block;
      width: 100%;
      height: auto;
      background: #fff3d6;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 14px;
      font-size: 14px;
      margin-top: 40px;
    }
    .nav-links a {
      text-decoration: none;
      opacity: .92;
    }
    .language-switcher {
      position: absolute;
      z-index: 6;
      top: 10px;
      right: min(5vw, 56px);
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .language-switcher a {
      min-height: 34px;
      border: 0;
      border-radius: 999px;
      padding: 6px 11px;
      background: rgba(255,255,255,.93);
      color: #111;
      box-shadow: 0 3px 10px rgba(0,0,0,.22);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
    }
    .language-switcher a[aria-current="page"] {
      outline: 3px solid rgba(23,107,90,.85);
      background: #fff7d6;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(340px, 520px);
      gap: min(5vw, 56px);
      align-items: start;
      padding: 118px min(5vw, 56px) 58px;
      color: #fff;
      background: transparent;
    }
    .hero-copy {
      max-width: 740px;
      padding-bottom: 32px;
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 88px);
      line-height: .95;
      letter-spacing: 0;
    }
    .hero-copy p {
      max-width: 620px;
      margin: 18px 0 0;
      font-size: clamp(18px, 2.2vw, 24px);
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
    .panel {
      background: rgba(255, 250, 239, .97);
      color: var(--ink);
      border: 1px solid #ead8b6;
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
      padding: 22px;

    .panel h2, section h2 {
      margin: 0 0 8px;

    .panel p {

      color: var(--muted);
    }
    .dashboard-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(310px, 420px);
      gap: 16px;
      margin: -44px min(5vw, 56px) 10px;
      position: relative;
      z-index: 2;
    }
    .quick-tiles {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin: 0;
    }
    .quick-tile {
      min-height: 126px;
      border: 2px solid rgba(255,255,255,.55);
      border-radius: 8px;
      padding: 16px 12px 13px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-decoration: none;
      text-shadow: 0 2px 8px rgba(0,0,0,.4);
      box-shadow: 0 10px 22px rgba(44,29,14,.25), inset 0 0 18px rgba(255,255,255,.15);
      position: relative;
      overflow: hidden;
    }
    .quick-tile::before {
      position: absolute;
      top: 12px;
      left: 15px;
      font-size: 36px;
      font-weight: 900;
    }
    .quick-tile.walk { background: linear-gradient(145deg, #4f7d18, #1f5a19); }
    .quick-tile.bike { background: linear-gradient(145deg, #2578a3, #07517a); }
    .quick-tile.sun { background: linear-gradient(145deg, #f6bc18, #d87800); }
    .quick-tile.wine { background: linear-gradient(145deg, #b34682, #763058); }
    .quick-tile.book { background: linear-gradient(145deg, #f07717, #c64108); }
    .quick-tile.call { background: linear-gradient(145deg, #149ab2, #096072); }
    .quick-tile.walk::before { content: "↟"; }
    .quick-tile.bike::before { content: "◎"; }
    .quick-tile.sun::before { content: "☼"; }
    .quick-tile.wine::before { content: "♢"; }
    .quick-tile.book::before { content: "▣"; }
    .quick-tile.call::before { content: "☎"; }
    .quick-tile span {
      font-size: 21px;
      font-weight: 950;
      line-height: 1;
    }
    .quick-tile small {
      margin-top: 5px;
      font-size: 14px;
      font-weight: 850;
    }
    .weather-live {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
      align-self: start;
      margin: 0;
      padding: 16px;
      border: 1px solid #ead9ba;
      border-radius: 8px;
      background: rgba(255, 250, 239, .97);
      box-shadow: 0 14px 35px rgba(43, 30, 17, .2);
    }
    .weather-live div {
      display: grid;
      gap: 3px;
      text-align: center;
    }
    .weather-live strong {
      font-size: 20px;
    }
    .weather-live span {
      font-size: 38px;
      font-weight: 950;
    }
    .weather-live small {
      color: var(--muted);
    }
    .weather-sun::before { content: "☼ "; color: #efac00; }
    .weather-cloud::before { content: "☁ "; color: #6d94c7; }
    .weather-rain::before { content: "☂ "; color: #438bd0; }
    .weather-snow::before { content: "❄ "; color: #6eaad1; }
    .weather-storm::before { content: "⚡ "; color: #d18b00; }
    .weather-live p {
      grid-column: 1 / -1;
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      background: linear-gradient(90deg, #88ce49, #ffd04b);
      font-weight: 900;
      text-align: center;
    }
    form {
      display: grid;
      gap: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
    }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    textarea {
      resize: vertical;
      min-height: 92px;
    }
    .extras, .rooms {
      display: grid;
      gap: 10px;
    }
    .choice {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-weight: 500;
    }
    .choice input {
      width: 18px;
      min-height: 18px;
    }
    .choice.disabled {
      opacity: .55;
      background: #f4f6f3;
    }
    .choice span {
      display: grid;
      gap: 2px;
    }
    .choice small {
      color: var(--muted);
      font-size: 12px;
    }
    .price {
      color: var(--brand);
      font-weight: 800;
      white-space: nowrap;
    }
    .total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0 3px;
      border-top: 1px solid var(--line);
    }
    .total strong {
      font-size: 24px;
      color: var(--brand);
    }
    .btn {
      border: 0;
      border-radius: 6px;
      background: var(--brand);
      color: #fff;
      min-height: 48px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: .55;
      background: #7d8a85;
    }
    .btn.secondary {
      background: #263b35;
    }
    .hint {
      padding: 11px;
      border-radius: 8px;
      background: var(--warn);
      color: #6d4b17;
      font-size: 13px;
    }
    .paypal-box {
      display: grid;
      gap: 4px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #f0d491;
      background: #fff8e4;
      color: #654817;
      font-size: 13px;
    }
    .paypal-box strong {
      color: var(--ink);
    }
    .paypal-box .btn {
      width: fit-content;
      min-height: 40px;
      margin-top: 6px;
      padding: 9px 13px;
      background: #0070ba;
      font-size: 13px;
    }
    .hidden {
      display: none !important;
    }
    .availability-status {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--brand);
      font-size: 13px;
      font-weight: 800;
    }
    .availability-status.blocked {
      background: #fff0eb;
      border-color: #f1b39f;
      color: #9a351f;
    }
        .availability-status.stale {
      border-color: #d4a017;
      background: #fff8df;
      color: #735900;
    }

.availability-status.note {
      background: #f4f0e8;
      color: #715725;
    }
    main {
      display: grid;
      gap: 52px;
      padding: 52px min(5vw, 56px);
      min-width: 0;
    }
    main > * { min-width: 0; max-width: 100%; }
    .section-head {
      max-width: 860px;
      margin-bottom: 20px;
    }
    .section-head p {
      margin: 0;
      color: var(--muted);
    }
    .room-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .room-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff9eb;
      box-shadow: 0 8px 18px rgba(49,31,14,.12);
    }
    .room-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: var(--soft);
    }
    .room-card div {
      display: grid;
      gap: 6px;
      padding: 14px;
    }
    .room-card h3 {
      margin: 0;
      font-size: 19px;
    }
    .room-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .fact {
      min-height: 116px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
    }
    .fact strong {
      display: block;
      margin-bottom: 6px;
    }
    .fact small {
      color: var(--muted);
    }
    .tips-section {
      display: grid;
      gap: 16px;
    }
    .tips-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }
    .tip-card {
      min-height: 154px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14px;
      border-radius: 8px;
      overflow: hidden;
      color: #fff;
      position: relative;
      box-shadow: 0 9px 20px rgba(41,29,15,.18);
      text-decoration: none;
    }
    .tip-card::after { content:""; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.05)); }
    .tip-card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .tip-card strong {
      position:relative; z-index:1; font-size: 16px;
    }
    .tip-card small {
      position:relative; z-index:1; color: #fff0c6;
    }
    .guest-app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 24px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f2f7ef;
      padding: 24px;
    }
    .guest-app p {
      max-width: 820px;
      color: var(--muted);
      margin: 0 0 16px;
    }
    .guest-app h2 {
      margin-bottom: 10px;
    }
    .windis-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .windis-list span {
      display: grid;
      gap: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .windis-list strong {
      color: var(--ink);
      font-size: 15px;
    }
    .guest-app-qr {
      display: grid;
      gap: 10px;
      justify-items: center;
      text-align: center;
      color: var(--brand);
      font-weight: 800;
      text-decoration: none;
    }
    .guest-app-qr img {
      width: 118px;
      height: 118px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px;
    }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding: 26px min(5vw, 56px);
      border-top: 1px solid var(--line);
      background: #17211f;
      color: #fff;
    }
    footer a {
      color: #fff;
    }
    .footer-main {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .legal-details {
      width: 100%;
      border-top: 1px solid rgba(255,255,255,.18);
      padding-top: 12px;
      color: rgba(255,255,255,.92);
    }
    .legal-details summary {
      cursor: pointer;
      font-weight: 800;
    }
    .legal-content {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .legal-content article {
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      padding: 14px;
    }
    .legal-content h3 {
      margin: 0 0 8px;
      color: #fff;
    }
    .legal-content p {
      margin: 0 0 8px;
      color: rgba(255,255,255,.78);
      font-size: 14px;
    }
    .mobile-language-select { display:none; }
    .mobile-hero-title,.mobile-hero-benefits { display:none; }
    #zielgruppen-faq .legal-content article {
      border: 1px solid var(--line);
      background: #fff;
    }
    #zielgruppen-faq .legal-content h3 {
      color: var(--ink);
    }
    #zielgruppen-faq details {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    #zielgruppen-faq summary {
      cursor: pointer;
      color: var(--ink);
      font-weight: 750;
    }
    #zielgruppen-faq details[open] summary {
      color: var(--brand);
    }
    #zielgruppen-faq .legal-content p {
      margin: 8px 0 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .status {
      display: none;
      padding: 12px;
      border-radius: 8px;
      background: var(--soft);
      color: var(--brand);
      font-weight: 800;
    }
    .status.show { display: block; }
    @media (max-width: 980px) {
      .hero-grid, .room-grid, .facts, .legal-content, .guest-app {
        grid-template-columns: 1fr;
      }
      .dashboard-strip {
        grid-template-columns: 1fr;
      }
      .quick-tiles,
      .tips-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .weather-live {
        grid-template-columns: 1fr 1fr;
      }
      .weather-live p {
        grid-column: 1 / 3;
      }
      .quick-tiles {
        margin-top: 0;
      }
      .windis-list { grid-template-columns: 1fr; }
      .hero-copy { padding-bottom: 0; }
      .top { min-height: 0; }
    }
    @media (max-width: 640px) {
      .nav { position: static; background: #15391f; align-items: flex-start; }
      .nav-links { display: none; }
      .hero-grid { padding-top: 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
      main { padding-top: 36px; }
      .quick-tiles,
      .tips-grid,
      .weather-live {
        grid-template-columns: 1fr;
      }
      .weather-live {
        margin: 0;
      }
      .weather-live p {
        grid-column: auto;
      }
      .quick-tiles {
        margin: 0;
      }
      .dashboard-strip {
        margin: 10px 18px 0;
      }
    }
  
    /* 10/10 Premium-Darstellung */
    :root { --brand-dark:#0d4d40; --cream:#fffaf0; }
    html { scroll-behavior:smooth; }

      padding:7px 11px; border:1px solid rgba(255,255,255,.45);

    }
    .hero-trust { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }

      padding:8px 11px; border-radius:999px; background:rgba(255,255,255,.93);

    .form-block-title {
      display:flex; align-items:center; gap:9px; margin:0;
      color:#17372f; font-size:15px; font-weight:900;
    }
    .form-block-title b {
      display:grid; place-items:center; width:27px; height:27px; border-radius:50%;

        return {
          state: "note",
          text: tr("calendarStale", { updated: bookingCalendarUpdated })
        };
      }
      return {
        state: "ok",
        text: tr("free", { mode: calendarModeLabel(), updated: bookingCalendarUpdated })
      };
    }

    function calculate() {
      updateRoomChoices();
      const n = nightCount();
      const people = Number(adults.value || 1);
      const room = selectedRoom();
      const roomPrice = room ? Math.round(Number(room.dataset.price || 0)) : 0;
      const currentQuoteKey = room ? [room.value, arrival.value, departure.value].join("|") : "";
      const hasLiveQuote = liveDirectPriceQuote && liveDirectPriceQuoteKey === currentQuoteKey;
      const roomTotal = hasLiveQuote
        ? Number(liveDirectPriceQuote.room_total_eur || 0)
        : n * roomPrice;
      let sum = roomTotal;
      for (const extra of selectedExtras()) {
        const price = Number(extra.dataset.price || 0);
        const unit = extra.dataset.unit;
        if (unit === "person_night") sum += price * people * n;
        else sum += price;
      }
      sum = Math.round(sum * 100) / 100;
      nights.value = String(n);
      total.textContent = money(sum);
      discountNote.textContent = tr("priceDisclaimer");
      const availability = availabilityText();
      availabilityStatus.className = "availability-status " + availability.state;
      availabilityStatus.textContent = availability.text;
      const hasValidDates = n > 0;
      const currentQuoteKeyForSubmit = room ? [room.value, arrival.value, departure.value].join("|") : "";
      const hasConfirmedLivePrice = Boolean(liveDirectPriceQuote && liveDirectPriceQuoteKey === currentQuoteKeyForSubmit);
      // Never submit a priced request using the 99 EUR fallback. The fallback is
      // display-only; selected dates require a confirmed server-side quote.
      const canSubmit = hasValidDates && availability.state !== "blocked" && hasConfirmedLivePrice;
      submitRequest.disabled = !canSubmit;
      submitRequest.textContent = canSubmit
        ? (availability.state === "ok" ? tr("requestButton") : tr("requestButtonPending"))
        : (hasValidDates && availability.state !== "blocked"
          ? (currentLang === "de" ? "Preis wird geprüft …" : "Price is being checked …")
          : (hasValidDates ? tr("unavailableButton") : tr("chooseDatesButton")));
      arrival.setCustomValidity(availability.state === "blocked" ? availability.text : "");
      departure.setCustomValidity(availability.state === "blocked" ? availability.text : "");
      // PayPal visibility and checkout state are controlled exclusively by zab-paypal-checkout.js.
      // The main form only calculates price and availability.
      if (!window.ZAB_DIRECT_BOOKING_API_URL) {
        paypalHint.textContent = tr("paymentPending", { amount: money(sum) });
      }
      return sum;
    }

    function applyLivePrices(payload) {
      const rooms = payload && payload.rooms ? payload.rooms : {};
      for (const [roomName, info] of Object.entries(rooms)) {
        const roomInput = Array.from(form.querySelectorAll('input[name="room"]')).find((item) => item.value === roomName);
        const rawPrice = typeof info === "number" ? info : (info.price ?? info.standard);
        const price = Math.round(Number(rawPrice));
        if (!roomInput || Number.isNaN(price)) continue;
        roomInput.dataset.price = String(price);
        const label = roomInput.closest(".choice").querySelector("b.price");
        if (label) label.textContent = money(price);
      }
    }

    async function loadLivePrices() {
      const room = selectedRoom();
      const n = nightCount();
      if (!LIVE_PRICE_API_URL || !room || n < 1 || !arrival.value || !departure.value) {
        liveDirectPriceQuote = null;
        liveDirectPriceQuoteKey = "";
        const label = room ? room.closest(".choice").querySelector("b.price") : null;
        if (label && room && room.value === "Bachblick") label.textContent = "ab 99 EUR";
        calculate();
        return;
      }

      const quoteKey = [room.value, arrival.value, departure.value].join("|");
      try {
        const params = new URLSearchParams({
          room: room.value,
          arrival: arrival.value,
          departure: departure.value
        });
        const response = await fetch(LIVE_PRICE_API_URL + "?" + params.toString(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const payload = await response.json();
        if (!payload.ok || typeof payload.room_total_eur !== "number") throw new Error("Ungueltige Preisdaten");
        liveDirectPriceQuote = payload;
        liveDirectPriceQuoteKey = quoteKey;

        const label = room.closest(".choice").querySelector("b.price");
        if (label) {
          if (payload.night_count === 1 && payload.nights && payload.nights[0]) {
            label.textContent = money(payload.nights[0].price_eur) + " / Nacht";
          } else {
            label.textContent = money(payload.room_total_eur) + " / " + payload.night_count + " Nächte";
          }
        }
      } catch (error) {
        liveDirectPriceQuote = null;
        liveDirectPriceQuoteKey = "";
        console.warn("Live-Preise konnten nicht geladen werden.", error);
      }
      calculate();
    }

    function buildMailBody(sum) {
      const n = nightCount();
      const room = selectedRoom();
      const extras = selectedExtras().map((item) => translateStaticText(item.value)).join(", ") || tr("none");
      const lines = [
        tr("mailIntro"),
        "",
        tr("labelName") + ": " + document.getElementById("firstName").value + " " + document.getElementById("lastName").value,
        tr("labelEmail") + ": " + document.getElementById("email").value,
        tr("labelPhone") + ": " + document.getElementById("phone").value,
        "",
        tr("labelArrival") + ": " + arrival.value,
        tr("labelDeparture") + ": " + departure.value,
        tr("labelNights") + ": " + n,
        tr("labelGuests") + ": " + adults.value,
        tr("labelRoom") + ": " + (room ? room.value : ""),
        tr("labelExtras") + ": " + extras,
        tr("labelDirectPrice") + ": " + money(sum),
        tr("labelPriceRule") + ": " + tr("priceRuleDiscount"),
        tr("labelCalendar") + ": " + availabilityText().text,
        tr("labelPayment"),
        tr("labelGuestApp"),
        "",
        tr("labelMessage") + ":",
        document.getElementById("message").value || "-",
        "",
        tr("noteCheck")
      ];
      return lines.join("\n");
    }

    async function loadLiveBookingCalendar() {
      if (!LIVE_BOOKING_API_URL) {
        liveBookingCalendarLoaded = true;
        liveBookingCalendarPending = false;
        calculate();
        return;
      }
      if (liveBookingCalendarPending) return;
      liveBookingCalendarPending = true;
      availabilityStatus.className = "availability-status note";
      availabilityStatus.textContent = tr("calendarLoading");
      try {
        const separator = LIVE_BOOKING_API_URL.includes("?") ? "&" : "?";
        const response = await fetch(LIVE_BOOKING_API_URL + separator + "v=" + Date.now(), {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache" }
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const payload = await response.json();
        if (!Array.isArray(payload.events)) throw new Error("Ungueltige Kalenderdaten");
        bachblickBookingBlocks = payload.events
          .filter((event) => event.start && event.end)
          .map((event) => ({ start: event.start, end: event.end }));
        bookingCalendarUpdated = payload.updatedAt || tr("justNow");
        bookingCalendarUpdatedIso = payload.updatedAtIso || new Date().toISOString();
        bookingCalendarMode = "live";
        liveBookingCalendarLoaded = true;
      } catch (error) {
        bookingCalendarMode = "offline";
        liveBookingCalendarLoaded = false;
        availabilityStatus.className = "availability-status note";
        availabilityStatus.textContent = "Booking-Abgleich derzeit nicht erreichbar. Es wird keine automatische Frei-Meldung angezeigt.";
      } finally {
        liveBookingCalendarPending = false;
      }
      calculate();
    }

    form.addEventListener("input", function() {
      sendOptions.classList.remove("show");
      copyConfirmation.textContent = "";
      calculate();
    });
    form.addEventListener("change", function(event) {
      if (["arrival", "departure", "room"].includes(event.target.name)) {
        liveDirectPriceQuote = null;
        liveDirectPriceQuoteKey = "";
        loadLiveBookingCalendar();
        loadLivePrices();
      } else {
        calculate();
      }
    });
    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      const requiredFields = Array.from(form.querySelectorAll("[required]"));
      const missingField = requiredFields.find((field) => !String(field.value || "").trim());
      if (missingField) {
        missingField.focus();
        alert(tr("requiredFields"));
        return;
      }
      const n = nightCount();
      if (n < 1) {
        alert(tr("invalidDates"));
        return;
      }
      if (LIVE_BOOKING_API_URL) {
        await loadLiveBookingCalendar();
      }
      const availability = availabilityText();
      const room = selectedRoom();
      const conflict = room && room.value === "Bachblick"
        ? blockedCalendarEntry(parseDate(arrival.value), parseDate(departure.value))
        : null;
      if (conflict) {
        alert(tr("blocked", { mode: calendarModeLabel(), updated: bookingCalendarUpdated }));
        return;
      }
      // Ein veralteter oder vorübergehend nicht erreichbarer Kalender darf eine
      // unverbindliche Anfrage nicht verhindern. Nur ein bestätigter Konflikt
      // blockiert den Versand.
      if (availability.state === "blocked") {
        alert(availability.text);
        return;
      }
      await loadLivePrices();
      const submitQuoteKey = room ? [room.value, arrival.value, departure.value].join("|") : "";
      if (!liveDirectPriceQuote || liveDirectPriceQuoteKey !== submitQuoteKey) {
        alert("Der aktuelle Direktpreis konnte nicht geladen werden. Bitte versuchen Sie es erneut.");
        return;
      }
      const sum = calculate();
      const subject = tr("mailSubject");
      const body = buildMailBody(sum);
      const emailHref = "mailto:Zuhause.am.Bach@outlook.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      const whatsappText = subject + "\n\n" + body;
      const whatsappHref = "https://wa.me/436646437526?text=" + encodeURIComponent(whatsappText);
      preparedRequestText = subject + "\n\n" + body;
      sendEmailLink.href = emailHref;
      sendWhatsappLink.href = whatsappHref;
      sendOptions.classList.add("show");
      statusBox.classList.add("show");
      sendOptions.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    copyRequestButton.addEventListener("click", async function() {
      if (!preparedRequestText) return;
      try {
        await navigator.clipboard.writeText(preparedRequestText);
        copyConfirmation.textContent = "Anfrage kopiert – jetzt in eine Nachricht einfügen.";
      } catch (error) {
        const helper = document.createElement("textarea");
        helper.value = preparedRequestText;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
        copyConfirmation.textContent = "Anfrage kopiert – jetzt in eine Nachricht einfügen.";
      }
    });

    const weatherCard = document.getElementById("wetter");
    const weatherTodayTemp = document.getElementById("weatherTodayTemp");
    const weatherTodayText = document.getElementById("weatherTodayText");
    const weatherTomorrowTemp = document.getElementById("weatherTomorrowTemp");
    const weatherTomorrowText = document.getElementById("weatherTomorrowText");
    const weatherHint = document.getElementById("weatherHint");
    function weatherClass(code) {
      if ([0, 1].includes(code)) return "weather-sun";
      if ([2, 3, 45, 48].includes(code)) return "weather-cloud";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "weather-snow";
      if ([95, 96, 99].includes(code)) return "weather-storm";
      return "weather-rain";
    }

    function weatherDescription(code) {
      const table = WEATHER_I18N[currentLang] || WEATHER_I18N.de;
      return table[code] || WEATHER_I18N.de[code] || "Wetterlage";
    }

    function updateWeatherHint(todayRain, tomorrowRain, todayCode) {
      if (todayRain >= 55 || tomorrowRain >= 65) {
        weatherHint.textContent = tr("weatherRainJacket");
      } else if ([0, 1, 2].includes(todayCode) && todayRain <= 25) {
        weatherHint.textContent = tr("weatherPerfect");
      } else {
        weatherHint.textContent = tr("weatherGood");
      }
    }

    function renderWeather(state) {
      weatherTodayTemp.className = weatherClass(state.todayCode);
      weatherTodayTemp.textContent = state.todayTemp + "°";
      weatherTodayText.textContent = weatherDescription(state.todayCode) + " · " + tr("rain") + " " + state.todayRain + "%";
      weatherTomorrowTemp.className = weatherClass(state.tomorrowCode);
      weatherTomorrowTemp.textContent = state.tomorrowTemp + "°";
      weatherTomorrowText.textContent = weatherDescription(state.tomorrowCode) + " · " + tr("rain") + " " + state.tomorrowRain + "%";
      updateWeatherHint(state.todayRain, state.tomorrowRain, state.todayCode);
    }

    async function loadWeather() {
      if (!weatherCard) return;
      const params = new URLSearchParams({
        latitude: weatherCard.dataset.weatherLat || "48.2945",
        longitude: weatherCard.dataset.weatherLon || "15.4068",
        current: "temperature_2m,weather_code",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        timezone: "Europe/Vienna",
        forecast_days: "5"
      });
      try {
        const response = await fetch("https://api.open-meteo.com/v1/forecast?" + params.toString(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        const todayCode = Number(data.current?.weather_code ?? data.daily?.weather_code?.[0] ?? 3);
        const todayTemp = Math.round(Number(data.current?.temperature_2m ?? data.daily?.temperature_2m_max?.[0] ?? 0));
        const todayRain = Number(data.daily?.precipitation_probability_max?.[0] ?? 0);
        const tomorrowCode = Number(data.daily?.weather_code?.[1] ?? todayCode);
        const tomorrowMax = Number(data.daily?.temperature_2m_max?.[1] ?? todayTemp);
        const tomorrowMin = Number(data.daily?.temperature_2m_min?.[1] ?? tomorrowMax);
        const tomorrowTemp = Math.round((tomorrowMax + tomorrowMin) / 2);
        const tomorrowRain = Number(data.daily?.precipitation_probability_max?.[1] ?? 0);
        latestWeatherState = { todayCode, todayTemp, todayRain, tomorrowCode, tomorrowTemp, tomorrowRain };
        renderWeather(latestWeatherState);
      } catch (error) {
        console.warn("Wetter konnte nicht geladen werden.", error);
        weatherTodayText.textContent = tr("weatherUnavailableToday");
        weatherTomorrowText.textContent = tr("weatherUnavailableTomorrow");
        weatherHint.textContent = tr("weatherUnavailableHint");
      }
    }

    loadLiveBookingCalendar();
    loadLivePrices();
    loadWeather();
    setInterval(loadLiveBookingCalendar, PRICE_REFRESH_MS);
    setInterval(loadLivePrices, PRICE_REFRESH_MS);
  </script>

  <script>
    document.querySelectorAll('.mobile-booking-bar *').forEach((element) => {
      element.childNodes.forEach((node) => {
        if (node.nodeType !== Node.TEXT_NODE || !node.nodeValue.trim()) return;
        const value = node.nodeValue;
        staticTextNodes.push({
          node,
          original: value.trim(),
          leading: value.match(/^\s*/)[0],
          trailing: value.match(/\s*$/)[0]
        });
      });
    });
    applyLanguage(currentLang, false);
    const mobileBookingBar = document.querySelector('.mobile-booking-bar');
    function updateMobileBookingBar() {
      if (!mobileBookingBar) return;
      const scrollable = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const progress = window.scrollY / scrollable;
      mobileBookingBar.classList.toggle('is-visible', progress >= 0.2);
    }
    window.addEventListener('scroll', updateMobileBookingBar, { passive:true });
    window.addEventListener('resize', updateMobileBookingBar);
    updateMobileBookingBar();
  </script>


  <script>
    (function(){
      const a=document.getElementById('arrival');
      const d=document.getElementById('departure');
      const steps=[...document.querySelectorAll('.booking-progress span')];
      const today=()=>{const x=new Date();x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
      if(a)a.min=today();
      function sync(){
        if(a&&d){d.min=a.value||today();if(d.value&&a.value&&d.value<=a.value)d.value='';}
        let n=0;
        if(a&&d&&a.value&&d.value)n=1;
        if(n===1&&document.querySelector('input[name="room"]:checked'))n=2;
        steps.forEach((s,i)=>{s.style.background=i===n?'var(--brand)':'#edf5f1';s.style.color=i===n?'#fff':'#38534b';});
      }
      a&&a.addEventListener('change',sync);
      d&&d.addEventListener('change',sync);
      document.querySelectorAll('input[name="room"]').forEach(x=>x.addEventListener('change',sync));
      sync();
    })();
  </script>

  <script>
    (function preparePrivacyFriendlyTracking() {
      window.dataLayer = window.dataLayer || [];
      window.zabTrack = function(eventName, details) {
        const payload = Object.assign({ event: eventName, timestamp: new Date().toISOString() }, details || {});
        window.dataLayer.push(payload);
        window.dispatchEvent(new CustomEvent('zab:analytics', { detail: payload }));
      };
      window.zabTrack('website_view', { page: 'direct_booking' });
      window.zabTrack('booking_page_view');
      document.addEventListener('click', function(event) {
        const link = event.target.closest('a');
        if (!link) return;
        if (link.matches('a[href^="tel:"]')) window.zabTrack('phone_click');
        if (link.matches('a[href^="mailto:"]')) window.zabTrack('email_click');
        if (link.href.includes('/Gaeste/')) window.zabTrack('guest_app_click');
        if (link.dataset.track) window.zabTrack(link.dataset.track);
      });
      document.querySelectorAll('input[name="room"]').forEach(function(input) {
        input.addEventListener('change', function() { if (input.checked) window.zabTrack('room_selected', { room: input.value }); });
      });
      const arrivalInput = document.getElementById('arrival');
      const departureInput = document.getElementById('departure');
      [arrivalInput, departureInput].forEach(function(input) {
        input?.addEventListener('change', function() {
          if (arrivalInput?.value && departureInput?.value) window.zabTrack('availability_check');
        });
      });
      document.getElementById('requestForm')?.addEventListener('submit', function() { window.zabTrack('checkout_started'); });
      document.getElementById('paypalLink')?.addEventListener('click', function() { window.zabTrack('payment_started'); });
    })();
  </script>
