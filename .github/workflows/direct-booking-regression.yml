name: Direct booking regression checks
on:
  push:
    branches: [fix/booking-reliability-20261026]
  pull_request:
    branches: [fix/booking-section-order]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile stripe_checkout.py app.py railway_app.py
      - name: Check browser JavaScript syntax
        run: node --check static/js/app.js
      - name: Check payment and price regressions without network
        run: python -m unittest discover -s tests -p 'test_booking_reliability_20261026.py' -v
