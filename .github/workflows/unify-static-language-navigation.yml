name: Validate static language navigation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current static navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html missing')

          s = p.read_text(encoding='utf-8')
          required = ['href="en/"', 'href="cs/"', 'href="sk/"', 'href="hu/"', 'href="pl/"', 'href="nl/"']
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Missing static language links: ' + ', '.join(missing))

          print('Static language navigation OK')
          PY
      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.js
