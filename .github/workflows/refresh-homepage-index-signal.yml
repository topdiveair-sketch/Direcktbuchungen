name: Refresh homepage index signal

on:
  push:
    paths:
      - '.github/workflows/refresh-homepage-index-signal.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh homepage lastmod
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          old = '<url><loc>https://topdiveair-sketch.github.io/Direcktbuchungen/</loc><lastmod>2026-09-02</lastmod></url>'
          new = '<url><loc>https://topdiveair-sketch.github.io/Direcktbuchungen/</loc><lastmod>2026-09-05</lastmod></url>'
          if old not in s:
              raise SystemExit('Homepage sitemap entry not found or already updated')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit sitemap refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh homepage search index signal"
          git push
