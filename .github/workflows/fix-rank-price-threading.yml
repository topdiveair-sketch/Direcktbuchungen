name: Fix Rang Preis Windows Threading

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-rank-price-threading.yml'

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch Tkinter threading
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path('windows_rank_price/app.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace('import os\nimport threading\n', 'import os\nimport queue\nimport threading\n', 1)

          s = s.replace(
              '        self.config_data = load_config()\n        self.own_price: float | None = None\n        self._build()\n',
              '        self.config_data = load_config()\n        self.own_price: float | None = None\n        self.result_queue = queue.Queue()\n        self._build()\n        self.after(100, self._drain_result_queue)\n',
              1,
          )

          old_fetch = '''        self.fetch_btn.state(["disabled"])
          self.status_var.set("Abruf läuft …")
          threading.Thread(target=self._fetch_worker, daemon=True).start()

    def _fetch_worker(self):
        base = self.api_var.get().strip().rstrip("/")
        params = urllib.parse.urlencode({
            "q": self.query_var.get().strip(),
            "room": self.room_var.get().strip(),
            "arrival": self.arrival_var.get().strip(),
            "departure": self.departure_var.get().strip(),
        })
        req = urllib.request.Request(
            f"{base}/api/windows/rank-price-check?{params}",
            headers={"X-Admin-Password": self.pw_var.get(), "Accept": "application/json", "User-Agent": "ZAB-RangPreis-Windows/1.0"},
        )
        try:
            with urllib.request.urlopen(req, timeout=35) as response:
                payload = json.loads(response.read().decode("utf-8", errors="replace"))
            self.after(0, lambda: self._show_result(payload))
        except urllib.error.HTTPError as exc:
            if exc.code == 401:
                msg = "Admin-Passwort wurde vom Server abgelehnt."
            else:
                msg = f"Serverfehler HTTP {exc.code}."
            self.after(0, lambda: self._show_error(msg))
        except Exception as exc:
            self.after(0, lambda: self._show_error(f"Abruf fehlgeschlagen: {type(exc).__name__}: {exc}"))

'''

          new_fetch = '''        request_data = {
            "base": self.api_var.get().strip().rstrip("/"),
            "password": self.pw_var.get(),
            "q": self.query_var.get().strip(),
            "room": self.room_var.get().strip(),
            "arrival": self.arrival_var.get().strip(),
            "departure": self.departure_var.get().strip(),
        }
        self.fetch_btn.state(["disabled"])
        self.status_var.set("Abruf läuft …")
        threading.Thread(target=self._fetch_worker, args=(request_data,), daemon=True).start()

    def _fetch_worker(self, request_data: dict):
        params = urllib.parse.urlencode({
            "q": request_data["q"],
            "room": request_data["room"],
            "arrival": request_data["arrival"],
            "departure": request_data["departure"],
        })
        req = urllib.request.Request(
            f"{request_data['base']}/api/windows/rank-price-check?{params}",
            headers={"X-Admin-Password": request_data["password"], "Accept": "application/json", "User-Agent": "ZAB-RangPreis-Windows/1.1"},
        )
        try:
            with urllib.request.urlopen(req, timeout=40) as response:
                payload = json.loads(response.read().decode("utf-8", errors="replace"))
            self.result_queue.put(("result", payload))
        except urllib.error.HTTPError as exc:
            if exc.code == 401:
                msg = "Admin-Passwort wurde vom Server abgelehnt."
            else:
                msg = f"Serverfehler HTTP {exc.code}."
            self.result_queue.put(("error", msg))
        except Exception as exc:
            self.result_queue.put(("error", f"Abruf fehlgeschlagen: {type(exc).__name__}: {exc}"))

    def _drain_result_queue(self):
        try:
            while True:
                kind, payload = self.result_queue.get_nowait()
                if kind == "result":
                    self._show_result(payload)
                else:
                    self._show_error(str(payload))
        except queue.Empty:
            pass
        finally:
            if self.winfo_exists():
                self.after(100, self._drain_result_queue)

'''

          if old_fetch not in s:
              raise SystemExit('Expected fetch/thread block not found; aborting patch')
          s = s.replace(old_fetch, new_fetch, 1)
          p.write_text(s, encoding='utf-8')

          installer = Path('windows_rank_price/installer.iss')
          if installer.exists():
              t = installer.read_text(encoding='utf-8')
              t = t.replace('#define MyAppVersion "1.0.0"', '#define MyAppVersion "1.1.0"', 1)
              installer.write_text(t, encoding='utf-8')
          '@ | Set-Content -Path patch_threading.py -Encoding utf8
          python patch_threading.py
          python -m py_compile windows_rank_price/app.py

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows_rank_price/app.py windows_rank_price/installer.iss
          git commit -m "Fix Windows rank price UI threading" || echo "No changes to commit"
          git push

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build desktop EXE
        shell: pwsh
        run: |
          Set-Location windows_rank_price
          pyinstaller --noconfirm --clean --onefile --windowed --name ZuhauseAmBach-RangPreis app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup EXE
        shell: pwsh
        run: |
          Set-Location windows_rank_price
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZuhauseAmBach-RangPreis-Setup-1.1
          path: windows_rank_price/dist-installer/ZuhauseAmBach-RangPreis-Setup.exe
          if-no-files-found: error
          retention-days: 30
