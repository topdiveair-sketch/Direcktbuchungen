name: Backend smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax checks
        run: |
          python -m py_compile             app.py             railway_app.py             wachauetappe_gateway.py             projectos_winter_gateway.py             booking_connectivity.py             zab_control_center_v3.py

      - name: Daily report and calendar sync regressions
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v test_daily_report.py test_calendar_sync.py test_calendar_db.py test_calendar_concurrency.py

      - name: JavaScript syntax checks
        run: |
          node --check scripts/update-booking-calendar.js
          node scripts/check-inline-js.js
