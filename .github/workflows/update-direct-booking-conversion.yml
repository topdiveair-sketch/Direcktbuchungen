name: Update direct booking conversion

on:
  push:
    paths:
      - '.github/workflows/update-direct-booking-conversion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve direct booking form
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              '<div class="booking-kicker">Erinnerungsstempel für Hausgäste inklusive</div><h2 id="booking-title">Wachau-Etappe direkt anfragen</h2><p class="booking-intro">Reisedaten wählen, persönlich anfragen und bei der Ankunft Ihren Wachau-Etappenstempel für Wanderpass oder Radreise-Tagebuch erhalten.</p><div class="booking-progress">',
              '<div class="booking-kicker">Erinnerungsstempel für Hausgäste inklusive</div><h2 id="booking-title">Wachau-Etappe direkt anfragen</h2><p class="booking-intro">Reisedaten wählen, persönlich anfragen und bei der Ankunft Ihren Wachau-Etappenstempel für Wanderpass oder Radreise-Tagebuch erhalten.</p><div class="direct-booking-trust" aria-label="Bewertung und Direktbuchungsvorteil"><strong>⭐ 9,0/10 – Hervorragend</strong><span>45 Gästebewertungen auf Booking.com</span><small>Direkt buchen zum besten verfügbaren Direktpreis.</small></div><div class="booking-progress">',
              'booking trust block'
          )

          replace_once(
              '<span><strong>Bachblick</strong><small>Anfrage möglich · erst nach Kalenderprüfung frei</small></span>',
              '<span><strong>Bachblick</strong><small>Jetzt anfragen – wir bestätigen die Verfügbarkeit persönlich.</small></span>',
              'Bachblick wording'
          )

          address_fields = '''            <label>Straße und Hausnummer <span class="optional-note">optional</span>
              <input id="street" name="street" autocomplete="street-address">
            </label>
            <label>PLZ <span class="optional-note">optional</span>
              <input id="zip" name="zip" autocomplete="postal-code">
            </label>
            <label>Ort <span class="optional-note">optional</span>
              <input id="city" name="city" autocomplete="address-level2">
            </label>
            <label>Land <span class="optional-note">optional</span>
              <input id="country" name="country" autocomplete="country-name">
            </label>
'''
          replace_once(address_fields, '', 'address fields')

          replace_once(
              '          </div>\n\n          <label>Nachricht oder Wünsche',
              '          </div>\n          <p class="checkin-data-note">Weitere Meldedaten benötigen wir erst beim Check-in.</p>\n\n          <label>Nachricht oder Wünsche',
              'check-in data note'
          )

          address_builder = '''      const address = [
        document.getElementById("street").value,
        document.getElementById("zip").value + " " + document.getElementById("city").value,
        document.getElementById("country").value
      ].filter(Boolean).join(", ");
'''
          replace_once(address_builder, '', 'mail address builder')

          replace_once(
              '        tr("labelPhone") + ": " + document.getElementById("phone").value,\n        tr("labelAddress") + ": " + address,\n        "",',
              '        tr("labelPhone") + ": " + document.getElementById("phone").value,\n        "",',
              'mail address line'
          )

          text = text.replace(
              'requiredFields: "Bitte alle Pflichtfelder ausfüllen, inklusive Telefonnummer, vollständiger Adresse und Nachricht."',
              'requiredFields: "Bitte alle Pflichtfelder ausfüllen: Vorname, Nachname, E-Mail und Telefonnummer."'
          )
          text = text.replace(
              'requiredFields: "Please fill in all required fields, including phone number, full address and message."',
              'requiredFields: "Please fill in all required fields: first name, last name, email and phone number."'
          )

          anchor = '    .booking-intro { margin:0 0 14px!important; color:#455e56!important; font-size:14px; }\n'
          styles = '''    .booking-intro { margin:0 0 14px!important; color:#455e56!important; font-size:14px; }
    .direct-booking-trust {
      display:grid; gap:3px; margin:0 0 14px; padding:12px 14px;
      border:1px solid #c8dfd4; border-radius:11px; background:#f1f8f4;
      color:#24483d;
    }
    .direct-booking-trust strong { font-size:16px; color:var(--brand-dark); }
    .direct-booking-trust span { font-size:13px; font-weight:800; }
    .direct-booking-trust small { color:#526b63; font-size:12px; font-weight:700; }
    .checkin-data-note {
      margin:0!important; padding:9px 11px; border-radius:8px;
      background:#f4f6f3; color:#52625d!important; font-size:12px; font-weight:750;
    }
'''
          replace_once(anchor, styles, 'conversion styles')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve direct booking conversion"
          git push
