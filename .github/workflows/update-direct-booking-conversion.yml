name: Update direct booking conversion

on:
  push:
    paths:
      - '.github/workflows/update-direct-booking-conversion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Improve direct booking form
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              text = text.replace(old, new, 1)

          # Trust and direct-price message directly in the booking box.
          old = '''<div class="booking-kicker">Erinnerungsstempel für Hausgäste inklusive</div><h2 id="booking-title">Wachau-Etappe direkt anfragen</h2><p class="booking-intro">Reisedaten wählen, persönlich anfragen und bei der Ankunft Ihren Wachau-Etappenstempel für Wanderpass oder Radreise-Tagebuch erhalten.</p><div class="booking-progress">'''
          new = '''<div class="booking-kicker">Erinnerungsstempel für Hausgäste inklusive</div><h2 id="booking-title">Wachau-Etappe direkt anfragen</h2><p class="booking-intro">Reisedaten wählen, persönlich anfragen und bei der Ankunft Ihren Wachau-Etappenstempel für Wanderpass oder Radreise-Tagebuch erhalten.</p><div class="direct-booking-trust" aria-label="Bewertung und Direktbuchungsvorteil"><strong>⭐ 9,0/10 – Hervorragend</strong><span>45 Gästebewertungen auf Booking.com</span><small>Direkt buchen zum besten verfügbaren Direktpreis.</small></div><div class="booking-progress">'''
          replace_once(old, new, 'booking trust block')

          # Make the availability wording more confidence-building.
          replace_once('''<span><strong>Bachblick</strong><small>Anfrage möglich · erst nach Kalenderprüfung frei</small></span>''', '''<span><strong>Bachblick</strong><small>Jetzt anfragen – wir bestätigen die Verfügbarkeit persönlich.</small></span>''', 'Bachblick wording')

          # Remove postal-address fields from the pre-booking form; these are collected at check-in.
          old = '''            <label>Straße und Hausnummer <span class="optional-note">optional</span>
              <input id="street" name="street" autocomplete="street-address">
            </label>
            <label>PLZ <span class="optional-note">optional</span>
              <input id="zip" name="zip" autocomplete="postal-code">
            </label>
            <label>Ort <span class="optional-note">optional</span>
              <input id="city" name="city" autocomplete="address-level2">
            </label>
            <label>Land <span class="optional-note">optional</span>
              <input id="country" name="country" autocomplete="country-name">
            </label>
'''
          replace_once(old, '', 'address fields')

          old = '''          </div>

          <label>Nachricht oder Wünsche'''
          new = '''          </div>
          <p class="checkin-data-note">Weitere Meldedaten benötigen wir erst beim Check-in.</p>

          <label>Nachricht oder Wünsche'''
          replace_once(old, new, 'check-in data note')

          # The mail body must no longer access removed address inputs.
          old = '''      const address = [
        document.getElementById("street").value,
        document.getElementById("zip").value + " " + document.getElementById("city").value,
        document.getElementById("country").value
      ].filter(Boolean).join(", ");
'''
          replace_once(old, '', 'mail address builder')
          replace_once('''        tr("labelPhone") + ": " + document.getElementById("phone").value,
        tr("labelAddress") + ": " + address,
        "",''', '''        tr("labelPhone") + ": " + document.getElementById("phone").value,
        "",''', 'mail address line')

          # Correct validation messages: only contact details are required online.
          text = text.replace('requiredFields: "Bitte alle Pflichtfelder ausfüllen, inklusive Telefonnummer, vollständiger Adresse und Nachricht."', 'requiredFields: "Bitte alle Pflichtfelder ausfüllen: Vorname, Nachname, E-Mail und Telefonnummer."')
          text = text.replace('requiredFields: "Please fill in all required fields, including phone number, full address and message."', 'requiredFields: "Please fill in all required fields: first name, last name, email and phone number."')

          # Styling for trust and check-in notes.
          anchor = '''    .booking-intro { margin:0 0 14px!important; color:#455e56!important; font-size:14px; }
'''
          addition = '''    .booking-intro { margin:0 0 14px!important; color:#455e56!important; font-size:14px; }
    .direct-booking-trust {
      display:grid; gap:3px; margin:0 0 14px; padding:12px 14px;
      border:1px solid #c8dfd4; border-radius:11px; background:#f1f8f4;
      color:#24483d;
    }
    .direct-booking-trust strong { font-size:16px; color:var(--brand-dark); }
    .direct-booking-trust span { font-size:13px; font-weight:800; }
    .direct-booking-trust small { color:#526b63; font-size:12px; font-weight:700; }
    .checkin-data-note {
      margin:0!important; padding:9px 11px; border-radius:8px;
      background:#f4f6f3; color:#52625d!important; font-size:12px; font-weight:750;
    }
'''
          replace_once(anchor, addition, 'conversion styles')

          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve direct booking conversion"
          git push
