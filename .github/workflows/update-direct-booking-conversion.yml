name: Harden sales-ready direct booking

on:
  push:
    paths:
      - .github/workflows/update-direct-booking-conversion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-sales-ready-booking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install robust PayPal primary submit handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          primary='<script src="zab-paypal-primary.js?v=20260913-2" defer></script>'
          if 'zab-paypal-primary.js?' not in s:
              marker='<script src="zab-paypal-checkout.js?v=20260913-5" defer></script>'
              if marker not in s:
                  raise SystemExit('Current PayPal checkout marker not found')
              s=s.replace(marker, marker+'\n  '+primary, 1)
          else:
              import re
              s=re.sub(r'<script src="zab-paypal-primary\.js\?v=[^"]+" defer></script>', primary, s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate PayPal browser path
        run: |
          grep -q 'zab-paypal-primary.js?v=20260913-2' index.html
          grep -q '/api/paypal/create-order' zab-paypal-primary.js
          grep -q '/api/paypal/quote' zab-paypal-primary.js
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable PayPal primary checkout on live page"
          git push
