name: Simplify direct booking actions

on:
  push:
    paths:
      - .github/workflows/update-direct-booking-conversion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simplify-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide redundant request button for live PayPal booking
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''      submitRequest.disabled = !canSubmit;
      submitRequest.textContent = canSubmit
        ? (availability.state === "ok" ? tr("requestButton") : tr("requestButtonPending"))
        : (hasValidDates ? tr("unavailableButton") : tr("chooseDatesButton"));'''
          new = '''      submitRequest.disabled = !canSubmit;
      submitRequest.textContent = canSubmit
        ? (availability.state === "ok" ? tr("requestButton") : tr("requestButtonPending"))
        : (hasValidDates ? tr("unavailableButton") : tr("chooseDatesButton"));
      // When live availability is confirmed, PayPal is the single primary action.
      // Keep the request button only as a fallback if live verification is not OK.
      submitRequest.classList.toggle("hidden", availability.state === "ok");'''
          if old not in s:
              raise SystemExit('request button logic anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Hide request button when PayPal booking is available"
          git push
