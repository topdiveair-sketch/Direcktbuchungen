name: Move PayPal below contact details

on:
  push:
    paths:
      - .github/workflows/update-direct-booking-conversion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-paypal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move PayPal block
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('          <div id="paypalBox" class="payment-after-confirmation hidden">')
          if start < 0:
              raise SystemExit('PayPal block not found')
          end = s.find('          </div>', start)
          if end < 0:
              raise SystemExit('PayPal block end not found')
          end += len('          </div>')
          block = s[start:end]
          s = s[:start] + s[end:]
          anchor = '          <p class="checkin-data-note">Weitere Meldedaten benötigen wir erst beim Check-in.</p>'
          pos = s.find(anchor)
          if pos < 0:
              raise SystemExit('Contact details anchor not found')
          pos += len(anchor)
          s = s[:pos] + '\n\n' + block + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Move PayPal below contact details"
          git push
