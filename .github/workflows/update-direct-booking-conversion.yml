name: Harden sales-ready direct booking

on:
  push:
    paths:
      - .github/workflows/update-direct-booking-conversion.yml
      - scripts/sales_ready_patch.py
      - scripts/language_checkout_patch.py
      - scripts/native_checkout_languages.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-sales-ready-booking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sales-ready patch
        run: python3 scripts/sales_ready_patch.py
      - name: Apply language-aware checkout patch
        run: python3 scripts/language_checkout_patch.py
      - name: Apply native checkout languages
        run: python3 scripts/native_checkout_languages.py
      - name: Install robust PayPal primary submit handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="zab-paypal-checkout.js?v=20260913-5" defer></script>'
          if marker not in s:
              marker='<script src="zab-paypal-checkout.js?v=20260913-4" defer></script>'
          primary='<script src="zab-paypal-primary.js?v=20260913-1" defer></script>'
          if primary not in s:
              if marker not in s:
                  raise SystemExit('PayPal checkout script marker not found')
              s=s.replace(marker, marker+'\n  '+primary, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate Python checkout modules
        run: python3 -m py_compile railway_app.py paypal_checkout.py
      - name: Validate PayPal browser scripts
        run: |
          grep -q 'zab-paypal-primary.js?v=20260913-1' index.html
          grep -q '/api/paypal/create-order' zab-paypal-primary.js
          grep -q '/api/paypal/quote' zab-paypal-primary.js
      - name: Commit patched production files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html zab-paypal-checkout.js en/index.html cs/index.html sk/index.html hu/index.html pl/index.html nl/index.html railway_app.py paypal_checkout.py
          git commit -m "Load robust PayPal primary checkout"
          git push
