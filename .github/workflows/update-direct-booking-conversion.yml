name: Unify direct booking PayPal UI

on:
  push:
    paths:
      - .github/workflows/update-direct-booking-conversion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unify-booking-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking UI ownership and wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              'paypalHint.textContent = tr("paymentPending", { amount: money(sum) });\n      paypalBox.classList.toggle("hidden", availability.state !== "ok");',
              '// PayPal visibility and checkout state are controlled exclusively by zab-paypal-checkout.js.\n      // The main form only calculates price and availability.\n      if (!window.ZAB_DIRECT_BOOKING_API_URL) {\n        paypalHint.textContent = tr("paymentPending", { amount: money(sum) });\n      }'
            ),
            (
              'Zimmerpreis und gewählte Zusatzleistungen werden transparent für die Anfrage berechnet. Verbindlich wird die Buchung erst nach persönlicher Bestätigung.',
              'Zimmerpreis und gewählte Zusatzleistungen werden transparent berechnet. Bei bestätigter Live-Verfügbarkeit können Sie direkt und sicher mit PayPal buchen.'
            ),
            (
              '<strong>Zahlung erst nach unserer Bestätigung</strong>\n            <span id="paypalHint">Bitte noch nicht bezahlen. Nach unserer persönlichen Buchungsbestätigung erhalten Sie die Zahlungsinformation.</span>',
              '<strong>Live-Verfügbarkeit & sichere Direktzahlung</strong>\n            <span id="paypalHint">Nach der Live-Prüfung erscheint hier die sichere PayPal-Direktbuchung, wenn der Termin frei ist.</span>'
            ),
            (
              '<span><strong>Bachblick</strong><small>Jetzt anfragen – wir bestätigen die Verfügbarkeit persönlich.</small></span>',
              '<span><strong>Bachblick</strong><small>Termin wählen – die Verfügbarkeit wird live geprüft.</small></span>'
            ),
            (
              '<div class="micro-trust"><span>🔒 Nur für Ihre Anfrage</span><span>☎ Persönliche Rückmeldung</span><span>✓ Keine versteckten Gebühren</span></div>',
              '<div class="micro-trust"><span>🔒 Sichere Direktbuchung</span><span>✓ Live-Verfügbarkeit</span><span>✓ Keine versteckten Gebühren</span></div>'
            ),
            (
              'zab-paypal-checkout.js?v=20260826-2',
              'zab-paypal-checkout.js?v=20260826-3'
            ),
            (
              '<title>Zuhause am Bach – Wachau | Donauradweg & Welterbesteig</title>',
              '<title>Zuhause am Bach – Etappenquartier Wachau | Donauradweg & Welterbesteig</title>'
            ),
            (
              '<meta name="description" content="Ruhig übernachten in Aggsbach Markt in der Wachau – ideal für Radfahrer am Donauradweg und Wanderer am Welterbesteig. Frühstück, Fahrradgarage und persönliche Wachau-Tipps.">',
              '<meta name="description" content="Etappenquartier in Aggsbach Markt in der Wachau – ruhig übernachten am Donauradweg und Welterbesteig. Direkt buchen mit Live-Verfügbarkeit, Frühstück, Fahrradgarage und persönlichen Wachau-Tipps.">'
            ),
            (
              '<span class="desktop-hero-title">Zuhause am Bach – Unterkunft am Donauradweg & Welterbesteig Wachau</span><span class="mobile-hero-title">Zuhause am Bach – Basislager am Donauradweg & Welterbesteig</span>',
              '<span class="desktop-hero-title">Zuhause am Bach – Etappenquartier & Unterkunft am Donauradweg und Welterbesteig Wachau</span><span class="mobile-hero-title">Zuhause am Bach – Etappenquartier am Donauradweg & Welterbesteig</span>'
            ),
            (
              '<div class="direct-booking-trust"><strong>Direkt bei den Gastgebern</strong><span>Persönliche Anfrage, transparente Leistungen und Live-Verfügbarkeitsprüfung.</span><small>Ohne Umweg über eine zusätzliche Buchungsplattform.</small></div><div class="booking-progress">',
              '<div class="direct-booking-trust"><strong>Direkt bei den Gastgebern</strong><span>Persönliche Anfrage, transparente Leistungen und Live-Verfügbarkeitsprüfung.</span><span class="booking-benefits">Alles für die nächste Etappe: Fahrrad sicher, E-Bike laden, Frühstück und Gepäckservice auf Anfrage.</span><small>Ohne Umweg über eine zusätzliche Buchungsplattform.</small></div><div class="booking-progress">'
            ),
            (
              '<div class="booking-progress"><span>1 · Reisedaten</span><span>2 · Zimmer</span><span>3 · Kontakt</span></div>',
              '<div class="booking-progress"><span>1 · Reisedaten</span><span>2 · Zimmer</span><span>3 · Kontakt & direkt buchen</span></div>'
            )
          ]

          changed = False
          for old, new in replacements:
            if old in s:
              s = s.replace(old, new, 1)
              changed = True
            elif new not in s:
              raise SystemExit('Expected booking UI anchor not found: ' + old[:80])

          if changed:
            p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "ProjectOS: Direktbuchungs-Conversion schärfen"
          git push
