name: Force fresh PayPal checkout script

on:
  push:
    paths:
      - .github/workflows/update-direct-booking-conversion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-bust-paypal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add versioned PayPal checkout script
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="zab-paypal-checkout.js?v=20260826-1" defer></script>\n'
          if 'zab-paypal-checkout.js?v=20260826-1' not in s:
              anchor = '  <script src="zab-conversion.js?v=20260814-1" defer></script>\n'
              if anchor not in s:
                  raise SystemExit('script anchor not found')
              s = s.replace(anchor, anchor + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Force fresh PayPal checkout script"
          git push
