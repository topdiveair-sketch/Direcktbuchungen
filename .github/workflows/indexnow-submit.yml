name: Submit production pages to IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'templates/**'
      - 'translations/**'
      - 'static/**'
      - '.github/workflows/indexnow-submit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly for production deploy
        run: sleep 45

      - name: Read live sitemap and submit official URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          host = 'www.zuhauseambach-wachau.at'
          base = 'https://www.zuhauseambach-wachau.at/'
          # This is the key served by the official www production service.
          key = 'zab-indexnow-20261012-jauerling'
          key_location = base + key + '.txt'
          sitemap_url = base + 'sitemap.xml'

          # A repository file alone does not verify the production host.
          # Fail before submitting if deployment or routing serves the wrong key.
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(key_location, timeout=20) as response:
                      key_body = response.read().decode('utf-8')
                      if response.status != 200 or response.geturl() != key_location:
                          raise ValueError('Key URL must return HTTP 200 without redirects')
                      if key_body.strip() != key:
                          raise ValueError('Public key file does not match submission key')
                      if response.headers.get_content_type() != 'text/plain':
                          raise ValueError('Public key file must be plain text')
                  print('Verified production key:', key_location)
                  break
              except Exception as exc:
                  print('Production key check failed:', attempt + 1, exc)
                  if attempt == 5:
                      raise SystemExit('IndexNow not submitted: production key verification failed')
                  time.sleep(20)

          urls = []
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(sitemap_url, timeout=20) as response:
                      root = ET.fromstring(response.read())
                  ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  urls = [
                      loc.text.strip()
                      for loc in root.findall('.//sm:loc', ns)
                      if loc.text and loc.text.strip().startswith(base)
                  ]
                  if urls:
                      break
              except Exception as exc:
                  print('Live sitemap attempt failed:', attempt + 1, exc)
              time.sleep(20)

          if not urls:
              urls = [
                  base,
                  base + 'unterkunft-wachau',
                  base + 'skifahren-jauerling-unterkunft-wachau',
                  base + 'winterurlaub-wachau',
                  base + 'en/',
                  base + 'cs/',
                  base + 'sk/',
                  base + 'hu/',
                  base + 'pl/',
                  base + 'nl/',
              ]

          urls = sorted(dict.fromkeys(urls))[:100]
          payload = json.dumps({
              'host': host,
              'key': key,
              'keyLocation': key_location,
              'urlList': urls,
          }).encode('utf-8')

          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'User-Agent': 'Zuhause-am-Bach-IndexNow/2.0',
              },
              method='POST',
          )

          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  print('IndexNow status:', response.status)
                  print('Official-domain URLs submitted:', len(urls))
                  if response.status == 200:
                      print('IndexNow received the URLs successfully; indexing is not guaranteed.')
                  elif response.status == 202:
                      print('IndexNow received the URLs; key validation is still pending.')
                  else:
                      raise SystemExit(f'Unexpected IndexNow status: {response.status}')
          except urllib.error.HTTPError as exc:
              body = exc.read().decode('utf-8', errors='replace')[:500]
              raise SystemExit(f'IndexNow HTTP {exc.code}: {body}')
          PY
