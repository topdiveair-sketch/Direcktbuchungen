name: Harden live direct pricing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate live direct pricing safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'hasConfirmedLivePrice',
              'await loadLivePrices();',
              'web-production-907d68.up.railway.app/api/direct-price',
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Missing live-pricing safeguards: ' + ', '.join(missing))
          if 'const LIVE_PRICE_API_URL = "";' in s:
              raise SystemExit('Live price API is disabled')
          if 'data-price="101"' in s or 'ab 101 EUR pro Nacht' in s:
              raise SystemExit('Stale 101 EUR value remains')
          print('Live direct pricing safeguards are present.')
          PY
