name: Harden live direct pricing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-live-direct-pricing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require confirmed live price before request
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''const hasValidDates = n > 0;\n      // A stale or temporarily unavailable calendar must not prevent a non-binding\n      // request. Only a confirmed conflict blocks the form.\n      const canSubmit = hasValidDates && availability.state !== "blocked";'''
          new='''const hasValidDates = n > 0;\n      const currentQuoteKeyForSubmit = room ? [room.value, arrival.value, departure.value].join("|") : "";\n      const hasConfirmedLivePrice = Boolean(liveDirectPriceQuote && liveDirectPriceQuoteKey === currentQuoteKeyForSubmit);\n      // Never submit a priced request using the 99 EUR fallback. The fallback is\n      // display-only; selected dates require a confirmed server-side quote.\n      const canSubmit = hasValidDates && availability.state !== "blocked" && hasConfirmedLivePrice;'''
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('submit gating block not found')

          old2='''      const sum = calculate();\n      const subject = tr("mailSubject");'''
          new2='''      await loadLivePrices();\n      const submitQuoteKey = room ? [room.value, arrival.value, departure.value].join("|") : "";\n      if (!liveDirectPriceQuote || liveDirectPriceQuoteKey !== submitQuoteKey) {\n        alert("Der aktuelle Direktpreis konnte nicht geladen werden. Bitte versuchen Sie es erneut.");\n        return;\n      }\n      const sum = calculate();\n      const subject = tr("mailSubject");'''
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif new2 not in s:
              raise SystemExit('submit price refresh block not found')

          if 'const LIVE_PRICE_API_URL = "";' in s:
              raise SystemExit('live price API still disabled')
          if 'hasConfirmedLivePrice' not in s or 'await loadLivePrices();' not in s:
              raise SystemExit('live pricing safety checks missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          import re,pathlib,subprocess,tempfile
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for attrs,code in re.findall(r'<script([^>]*)>(.*?)</script>',s,flags=re.S|re.I):
              if not code.strip() or 'application/ld+json' in attrs.lower(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(code); name=f.name
              subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Require live server quote before direct request'
          git push
