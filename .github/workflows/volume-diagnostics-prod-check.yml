name: Volume diagnostics security tests
on:
  push:
    branches:
      - fix/volume-diagnostics-prod-prep
  pull_request:
    branches:
      - fix/booking-section-order
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask
      - run: python -m unittest -v test_volume_diagnostics.py
      - run: python -m py_compile volume_diagnostics.py railway_app.py
