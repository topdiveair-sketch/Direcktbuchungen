name: Fix Rang Preis Windows Font

on:
  push:
    paths:
      - '.github/workflows/fix-rank-price-font.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Tcl-safe Segoe UI font
        shell: python
        run: |
          from pathlib import Path
          path = Path('windows_rank_price/app.py')
          text = path.read_text(encoding='utf-8')
          old = 'self.option_add("*Font", "Segoe UI 10")'
          new = 'self.option_add("*Font", "{Segoe UI} 10")'
          if old not in text:
              raise SystemExit('Expected font line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows_rank_price/app.py
          git commit -m "Fix Windows rank price Tcl font startup crash"
          git push origin HEAD:main
