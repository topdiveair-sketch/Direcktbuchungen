name: Homepage translations guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test homepage translation guard
        run: python -m unittest tests.test_homepage_translation_guard -v
      - name: Validate eleven-language catalog
        run: python scripts/check_homepage_translations.py
      - name: Require catalog update when homepage copy changes
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED="$(git diff --name-only HEAD^ HEAD)"
            if echo "$CHANGED" | grep -qx "templates/index.html" &&
               ! echo "$CHANGED" | grep -qx "translations/public_home.json"; then
              python scripts/check_homepage_translation_change.py HEAD^ HEAD
            fi
          fi
