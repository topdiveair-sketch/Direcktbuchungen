name: Verify 5 percent portal markup
on:
  push:
    branches:
      - fix/portal-markup-5-cap-199-20261014
  workflow_dispatch:
jobs:
  pricing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_channel_pricing
