name: Booking-Kalender aktualisieren

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booking-calendar-update
  cancel-in-progress: false

jobs:
  update-booking-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Booking-iCal abrufen
        env:
          GOOGLE_ICAL_URL: ${{ secrets.GOOGLE_ICAL_URL }}
          GOOGLE_ICAL_URLS: ${{ secrets.GOOGLE_ICAL_URLS }}
        run: node scripts/update-booking-calendar.js
      - name: Kalenderdateien prüfen
        run: |
          node --check scripts/update-booking-calendar.js
          node scripts/check-inline-js.js
      - name: Änderungen speichern
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Booking-Kalender aktualisieren"
          file_pattern: booking-calendar.json index.html
