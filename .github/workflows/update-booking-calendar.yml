name: ZAB-OS-Masterkalender aktualisieren

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-booking-calendar.yml'
      - 'scripts/update-booking-calendar.js'
      - 'zab_control_center_v3.py'
      - 'master_calendar.py'
      - 'master_calendar_v2.py'
      - 'railway_app.py'
      - 'wachauetappe_gateway.py'

permissions:
  contents: write

concurrency:
  group: zab-os-master-calendar-update
  cancel-in-progress: false

jobs:
  update-booking-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ZAB OS Master-Kalender abrufen
        env:
          # Produktiver Railway-Dienst. Bewusst fest gesetzt, damit eine leere
          # oder veraltete Repository-Variable den Masterfeed nicht auf einen
          # alten Railway-Host umbiegt.
          ZAB_MASTER_ICAL_URL: https://web-production-907d68.up.railway.app/calendar/public/Bachblick.ics
          ZAB_MASTER_ALLOW_BOOKING_FALLBACK: ${{ vars.ZAB_MASTER_ALLOW_BOOKING_FALLBACK }}
          ZAB_MASTER_INCLUDE_LEGACY_BLOCKS: ${{ vars.ZAB_MASTER_INCLUDE_LEGACY_BLOCKS }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          GOOGLE_ICAL_URL: ${{ secrets.GOOGLE_ICAL_URL }}
          GOOGLE_ICAL_URLS: ${{ secrets.GOOGLE_ICAL_URLS }}
          MANUAL_BOOKING_BLOCKS_JSON: ${{ vars.MANUAL_BOOKING_BLOCKS_JSON }}
        run: node scripts/update-booking-calendar.js
      - name: Kalenderdateien prüfen
        run: |
          node --check scripts/update-booking-calendar.js
          node scripts/check-inline-js.js
      - name: Änderungen speichern
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ZAB OS Master-Kalender aktualisieren"
          file_pattern: booking-calendar.json index.html
