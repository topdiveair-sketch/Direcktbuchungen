name: Growth Engine Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'growth-engine/**'
      - '.github/workflows/growth-engine-deploy.yml'

env:
  BOOKING_WORKER_URL: https://zab-booking-live.topdiveair.workers.dev
  RUNTIME_BASE_URL: https://zab-windis-growth-runtime.topdiveair.workers.dev
  GROWTH_ACTION_URL: https://web-production-f05a4.up.railway.app/growth/action

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: growth-engine-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CHANNEL_WEBHOOK_TOKEN: ${{ secrets.CHANNEL_WEBHOOK_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$BOOKING_ICAL_URL" || (echo 'Missing BOOKING_ICAL_URL' && exit 1)
          test -n "$ADMIN_TOKEN" || (echo 'Missing ADMIN_TOKEN' && exit 1)
          test ${#ADMIN_TOKEN} -ge 24 || (echo 'ADMIN_TOKEN must be at least 24 characters' && exit 1)
          if [ -n "$CHANNEL_WEBHOOK_TOKEN" ]; then test ${#CHANNEL_WEBHOOK_TOKEN} -ge 24 || (echo 'CHANNEL_WEBHOOK_TOKEN must be at least 24 characters' && exit 1); fi

      - name: Deploy Booking availability worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare-worker
        run: npx wrangler@latest deploy

      - name: Install Booking iCal secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
        working-directory: cloudflare-worker
        run: printf '%s' "$BOOKING_ICAL_URL" | npx wrangler@latest secret put BOOKING_ICAL_URL

      - name: Verify Booking worker
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors -o booking-worker.json "$BOOKING_WORKER_URL"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('booking-worker.json','utf8'));if(j.ok!==true||!Array.isArray(j.events))process.exit(1);console.log('Booking worker OK, events:',j.events.length)"

      - name: Install runtime dependencies
        working-directory: growth-engine/runtime
        run: npm install --ignore-scripts

      - name: Validate Growth Runtime configuration
        env:
          BOOKING_WORKER_URL: ${{ env.BOOKING_WORKER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WINDIS_DATA_URL: ${{ secrets.WINDIS_DATA_URL }}
        working-directory: growth-engine/runtime
        run: npm run preflight

      - name: Deploy Growth Runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: growth-engine/runtime
        run: npx wrangler deploy --var BOOKING_WORKER_URL:$BOOKING_WORKER_URL --var WINDIS_DATA_URL:${{ secrets.WINDIS_DATA_URL }} --var PUBLISH_WEBHOOK_URL:$GROWTH_ACTION_URL --var OUTREACH_WEBHOOK_URL:$GROWTH_ACTION_URL

      - name: Install Growth Runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CHANNEL_WEBHOOK_TOKEN: ${{ secrets.CHANNEL_WEBHOOK_TOKEN }}
        working-directory: growth-engine/runtime
        run: |
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          if [ -n "$CHANNEL_WEBHOOK_TOKEN" ]; then printf '%s' "$CHANNEL_WEBHOOK_TOKEN" | npx wrangler secret put CHANNEL_WEBHOOK_TOKEN; fi

      - name: Health check
        working-directory: growth-engine/runtime
        run: npm run postdeploy -- "$RUNTIME_BASE_URL"

      - name: First live planning run
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          endpoint="$RUNTIME_BASE_URL/agents/growth-runtime/main/run-now"
          for attempt in 1 2 3 4 5 6; do
            http_code=$(curl --silent --show-error -o planning-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "$endpoint" || true)
            if [ "$http_code" = "200" ]; then cat planning-response.json; exit 0; fi
            echo "Planning attempt $attempt returned HTTP $http_code"; cat planning-response.json || true
            if grep -q 'Durable Object reset because its code was updated' planning-response.json 2>/dev/null && [ "$attempt" -lt 6 ]; then sleep $((attempt * 5)); continue; fi
            exit 1
          done
          exit 1
