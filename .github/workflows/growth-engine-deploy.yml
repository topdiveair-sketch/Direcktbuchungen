name: Growth Engine Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'growth-engine/**'
      - '.github/workflows/growth-engine-deploy.yml'
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: growth-engine-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install runtime dependencies
        working-directory: growth-engine/runtime
        run: npm install --ignore-scripts
      - name: Validate required configuration
        env:
          BOOKING_WORKER_URL: ${{ secrets.BOOKING_WORKER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WINDIS_DATA_URL: ${{ secrets.WINDIS_DATA_URL }}
        working-directory: growth-engine/runtime
        run: npm run preflight
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: growth-engine/runtime
        run: npx wrangler deploy --var BOOKING_WORKER_URL:${{ secrets.BOOKING_WORKER_URL }} --var WINDIS_DATA_URL:${{ secrets.WINDIS_DATA_URL }}
      - name: Install admin secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        working-directory: growth-engine/runtime
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
      - name: Health check
        env:
          RUNTIME_BASE_URL: ${{ secrets.RUNTIME_BASE_URL }}
        working-directory: growth-engine/runtime
        run: npm run postdeploy -- "$RUNTIME_BASE_URL"
      - name: First live planning run
        env:
          RUNTIME_BASE_URL: ${{ secrets.RUNTIME_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$RUNTIME_BASE_URL/agents/growth-runtime/main/run-now"
