name: WachauEtappe Windows Build

on:
  push:
    paths:
      - 'windows/WachauEtappe.Zentrale/**'
      - '.github/workflows/wachauetappe-windows-build.yml'
  pull_request:
    paths:
      - 'windows/WachauEtappe.Zentrale/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore windows/WachauEtappe.Zentrale/WachauEtappe.Zentrale.csproj
      - name: Build
        run: dotnet build windows/WachauEtappe.Zentrale/WachauEtappe.Zentrale.csproj --configuration Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish windows/WachauEtappe.Zentrale/WachauEtappe.Zentrale.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/WachauEtappe-Zentrale
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WachauEtappe-Zentrale-win-x64
          path: artifacts/WachauEtappe-Zentrale
