name: ProjectOS Direktbuchung Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate booking site
        shell: bash
        run: |
          test -f index.html
          grep -qi "Direkt" index.html
          test -f sitemap.xml
      - name: Package current site
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/zab-direktbuchung.zip . -x '.git/*' 'dist/*'
          cd dist
          sha256sum zab-direktbuchung.zip > SHA256SUMS.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectos-direktbuchung
          path: |
            dist/zab-direktbuchung.zip
            dist/SHA256SUMS.txt
          retention-days: 14
