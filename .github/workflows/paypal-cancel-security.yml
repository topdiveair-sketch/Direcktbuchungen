name: PayPal cancel security
on:
  pull_request:
    paths:
      - 'paypal_checkout.py'
      - 'stripe_webhook_security.py'
      - 'stripe_checkout_payload.py'
      - 'stripe_checkout_client.py'
      - 'stripe_booking_verification.py'
      - 'stripe_booking_settlement.py'
      - 'stripe_hold_release.py'
      - 'tests/test_stripe_hold_release.py'
      - 'tests/test_stripe_booking_settlement.py'
      - 'tests/test_stripe_booking_verification.py'
      - 'tests/test_stripe_checkout_client.py'
      - 'tests/test_stripe_checkout_payload.py'
      - 'tests/test_stripe_webhook_security.py'
      - 'booking_notifications.py'
      - 'tests/test_paypal_cancel_signature.py'
      - 'tests/test_paypal_cancel_database.py'
      - 'tests/test_paypal_reconciliation_route.py'
      - '.github/workflows/paypal-cancel-security.yml'
  workflow_dispatch:
jobs:
  paypal-cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest flask
      - run: python -m pytest -q tests/test_paypal_cancel_signature.py tests/test_paypal_cancel_database.py tests/test_paypal_reconciliation_route.py tests/test_stripe_webhook_security.py tests/test_stripe_checkout_payload.py tests/test_stripe_checkout_client.py tests/test_stripe_booking_verification.py tests/test_stripe_booking_settlement.py tests/test_stripe_hold_release.py
