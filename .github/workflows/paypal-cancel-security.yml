name: PayPal cancel security
on:
  pull_request:
    paths:
      - 'paypal_checkout.py'
      - 'booking_notifications.py'
      - 'tests/test_paypal_cancel_signature.py'
      - 'tests/test_paypal_cancel_database.py'
      - '.github/workflows/paypal-cancel-security.yml'
  workflow_dispatch:
jobs:
  paypal-cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_paypal_cancel_signature.py tests/test_paypal_cancel_database.py
