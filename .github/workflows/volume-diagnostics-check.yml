name: Volume diagnostics isolated tests
on:
  push:
    branches:
      - diagnostics/read-only-volume-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask
      - run: python -m unittest -v test_volume_diagnostics.py
