name: Fix Rang Preis SERP UI

on:
  push:
    paths:
      - '.github/workflows/fix-rank-price-serp-ui.yml'
      - 'scripts/patch_rank_price_serp_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Windows UI
        run: python scripts/patch_rank_price_serp_ui.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows_rank_price/app.py
          if git diff --cached --quiet; then
            echo "No UI changes needed"
            exit 0
          fi
          git commit -m "Fix noisy SERP errors in Windows rank list"
          git push
