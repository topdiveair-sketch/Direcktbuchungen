name: Add Filmgeschichte Teaser

on:
  push:
    paths:
      - '.github/workflows/add-filmgeschichte-teaser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert teaser into homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '''    <section id="gaesteapp" class="guest-app">'''
          teaser = '''    <section id="filmgeschichte" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;padding:26px;border:1px solid #ead8b6;border-radius:8px;background:linear-gradient(135deg,#fff7df,#eef5f0);box-shadow:0 10px 26px rgba(49,31,14,.10)">
      <div>
        <span class="eyebrow">Aggsbach Markt – wo Geschichten entstehen</span>
        <h2>🎬 Als Mariandl 1961 nach Aggsbach Markt kam</h2>
        <p style="margin:0 0 16px;color:var(--muted);max-width:820px">Aggsbach Markt gehörte zu den Drehorten des österreichischen Filmklassikers „Mariandl“. Fidel, Gloria und Pia folgen den Spuren des damaligen Marktplatzes, der Unfallszene mit dem weißen Cadillac und des ehemaligen Hotel Post.</p>
        <a class="btn" href="geschichten-aggsbach-markt.html">Filmgeschichte entdecken</a>
      </div>
      <div aria-hidden="true" style="font-size:clamp(54px,8vw,92px);line-height:1">🎬🐾</div>
    </section>

'''
          if 'id="filmgeschichte"' not in text:
              if marker not in text:
                  raise SystemExit('Expected guest-app marker not found')
              p.write_text(text.replace(marker, teaser + marker, 1), encoding='utf-8')
      - name: Commit homepage patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link Mariandl film history from homepage"
          git push
