name: Growth Engine CI
on:
  pull_request:
    paths:
      - 'growth-engine/**'
      - '.github/workflows/growth-engine-ci.yml'
  push:
    branches: [growth-engine-v1]
    paths:
      - 'growth-engine/**'
      - '.github/workflows/growth-engine-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test core growth engine
        working-directory: growth-engine
        run: npm test
      - name: Validate runtime install
        working-directory: growth-engine/runtime
        run: npm install --ignore-scripts
      - name: Wrangler dry run
        working-directory: growth-engine/runtime
        run: npx wrangler deploy --dry-run --outdir dist-dry-run
