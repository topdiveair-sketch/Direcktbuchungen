name: Fix booking safety

on:
  push:
    paths:
      - '.github/workflows/fix-booking-safety.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-booking-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: PayPal-Checkout gegen bekannte Booking-Sperren absichern
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js_path = Path('zab-paypal-checkout.js')
          js = js_path.read_text(encoding='utf-8')
          old = '    function checkoutHeading(text){\n      const heading=paypalBox?.querySelector("strong");\n      if(heading) heading.textContent=text;\n    }\n'
          new = old + '\n    function localCalendarBlocked(){\n      return Boolean(availability && availability.classList.contains("blocked"));\n    }\n'
          if 'function localCalendarBlocked()' not in js:
              if old not in js: raise SystemExit('checkoutHeading-Anker nicht gefunden')
              js = js.replace(old, new, 1)
          old = '    function showAvailable(data,result){\n      form.classList.remove("zab-booking-blocked");\n'
          new = '    function showAvailable(data,result){\n      if(localCalendarBlocked()){\n        showBlocked("Der Booking-Kalender sperrt diesen Zeitraum. Eine Backend-Frei-Meldung darf diese Sperre nicht überschreiben.");\n        return false;\n      }\n      form.classList.remove("zab-booking-blocked");\n'
          if 'Eine Backend-Frei-Meldung darf diese Sperre nicht überschreiben.' not in js:
              if old not in js: raise SystemExit('showAvailable-Anker nicht gefunden')
              js = js.replace(old, new, 1)
          old = '      if(!validDates(data)){\n        hidePayPal();\n        return false;\n      }\n      if(data.extras.etappenjause){\n'
          new = '      if(!validDates(data)){\n        hidePayPal();\n        return false;\n      }\n      if(localCalendarBlocked()){\n        showBlocked("Der Booking-Kalender sperrt diesen Zeitraum. Bitte einen anderen Termin wählen.");\n        return false;\n      }\n      if(data.extras.etappenjause){\n'
          if old in js:
              js = js.replace(old, new, 1)
          old = '      const data=payload();\n      const missing=missingCustomer(data);\n'
          new = '      const data=payload();\n      if(localCalendarBlocked()){\n        showBlocked("Der Booking-Kalender sperrt diesen Zeitraum. Bitte einen anderen Termin wählen.");\n        return;\n      }\n      const missing=missingCustomer(data);\n'
          if old in js:
              js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')
          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace('zab-paypal-checkout.js?v=20260826-3', 'zab-paypal-checkout.js?v=20260910-1')
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: JavaScript prüfen
        run: node --check zab-paypal-checkout.js

      - name: Fix speichern
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Keine Änderung erforderlich.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zab-paypal-checkout.js index.html
          git commit -m 'Prevent backend from overriding Booking blocks'
          git push
