name: WachauEtappe Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guest_booking_gateway.py"
      - "partner_portal_gateway.py"
      - "wachauetappe_gateway.py"
      - "wachauetappe_operations.py"
      - "wachauetappe_notifications.py"
      - ".github/workflows/wachauetappe-production-smoke.yml"

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway rollout
        run: sleep 45
      - name: Production health
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10             https://web-production-2b242.up.railway.app/health/wachauetappe_production
      - name: Guest booking API health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5             https://web-production-2b242.up.railway.app/health/wachauetappe-bookings
      - name: Market readiness gate
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5             https://web-production-2b242.up.railway.app/health/wachauetappe_market_ready
