name: Update SEO identity

on:
  push:
    paths:
      - '.github/workflows/update-seo-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-seo-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize homepage SEO identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text
          base = 'https://topdiveair-sketch.github.io/Direcktbuchungen/'

          text = text.replace(
              '<title>Zuhause am Bach | Unterkunft Donauradweg & Welterbesteig Wachau</title>',
              '<title>Zuhause am Bach – Wachau | Donauradweg & Welterbesteig</title>'
          )
          text = text.replace(
              'content="Zuhause am Bach | Unterkunft Donauradweg & Welterbesteig Wachau"',
              'content="Zuhause am Bach – Wachau | Donauradweg & Welterbesteig"'
          )

          canonical = f'<link rel="canonical" href="{base}">'
          hreflang_block = '\n'.join([
              f'  <link rel="alternate" hreflang="de-AT" href="{base}">',
              f'  <link rel="alternate" hreflang="en" href="{base}en/">',
              f'  <link rel="alternate" hreflang="cs" href="{base}cs/">',
              f'  <link rel="alternate" hreflang="sk" href="{base}sk/">',
              f'  <link rel="alternate" hreflang="hu" href="{base}hu/">',
              f'  <link rel="alternate" hreflang="pl" href="{base}pl/">',
              f'  <link rel="alternate" hreflang="nl" href="{base}nl/">',
              f'  <link rel="alternate" hreflang="x-default" href="{base}">',
          ])
          if 'hreflang="de-AT"' not in text and canonical in text:
              text = text.replace(canonical, canonical + '\n' + hreflang_block, 1)

          text = re.sub(
              r'("name"\s*:\s*)"Zuhause am Bach"',
              r'\1"Zuhause am Bach – Wachau"',
              text,
              count=1,
          )
          text = re.sub(
              r'("dateModified"\s*:\s*)"[0-9]{4}-[0-9]{2}-[0-9]{2}"',
              r'\1"2026-09-02"',
              text,
              count=1,
          )

          same_as = [
              'https://www.booking.com/hotel/at/zu-hause-am-bach.de.html',
              'https://www.google.com/travel/hotels/entity/CgsIncbWpIupyZPWARAB',
              'https://www.donau.com/wachau-nibelungengau-kremstal/unterkunft/zu-hause-am-bach-wachau',
              'https://www.outdooractive.com/de/accommodation/donau-niederoesterreich/zuhause-am-bach-wachau-privatzimmer-wo-geschichten-entstehen/811315184/',
              'https://www.holidaycheck.at/hi/zuhause-am-bach-ruhige-unterkunft-fuer-erholungssuchende-am-welterbesteig-und-donauradweg/d66cc36b-7f57-4db0-8211-e5f75fcc669a'
          ]
          if '"sameAs"' not in text:
              marker = '    "telephone": "+436646437526",'
              block = '    "sameAs": [\n' + ',\n'.join(f'      "{u}"' for u in same_as) + '\n    ],\n'
              if marker in text:
                  text = text.replace(marker, block + marker, 1)

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('index.html updated')
          else:
              print('No changes required')
          PY

      - name: Validate homepage SEO
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert '<title>Zuhause am Bach – Wachau | Donauradweg & Welterbesteig</title>' in text
          for lang in ('de-AT','en','cs','sk','hu','pl','nl','x-default'):
              assert f'hreflang="{lang}"' in text, lang
          assert '"name": "Zuhause am Bach – Wachau"' in text
          assert '"sameAs"' in text
          assert '"email": "Zuhause.am.Bach@outlook.com"' in text
          print('SEO identity validation passed')
          PY

      - name: Commit SEO identity update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Normalize brand identity, hreflang and profile links'
          git push
