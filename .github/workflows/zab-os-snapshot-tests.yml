name: ZAB OS snapshot Flask checks
on:
  pull_request:
    paths:
      - "zab_os_snapshot_server.py"
      - "test_zab_os_snapshot_flask.py"
      - "zab_os_snapshot_client.py"
      - "test_zab_os_snapshot_client.py"
      - "zab_os_compare_exports.py"
      - "test_zab_os_compare_exports.py"
      - ".github/workflows/zab-os-snapshot-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flask-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Flask
        run: python -m pip install Flask==3.1.1
      - name: Compile snapshot module
        run: python -m py_compile zab_os_snapshot_server.py test_zab_os_snapshot_flask.py zab_os_snapshot_client.py test_zab_os_snapshot_client.py zab_os_compare_exports.py test_zab_os_compare_exports.py
      - name: Run Flask HTTP tests
        run: python -m unittest -v test_zab_os_snapshot_flask test_zab_os_snapshot_client test_zab_os_compare_exports
