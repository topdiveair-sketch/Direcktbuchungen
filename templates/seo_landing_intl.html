<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="alternate" hreflang="sk" href="https://www.zuhauseambach-wachau.at/sk/ubytovanie-wachau">

<meta property="og:url" content="{{ canonical }}">

<script type="application/ld+json">{{ {"@context":"https://schema.org","@type":"WebPage","name":title,"url":canonical,"description":description,"inLanguage":lang,"about":{"@type":"BedAndBreakfast","@id":"https://www.zuhauseambach-wachau.at/#unterkunft","name":"Zuhause am Bach – Wachau","url":"https://www.zuhauseambach-wachau.at/","address":{"@type":"PostalAddress","streetAddress":"Aggsbach Markt 82","postalCode":"3641","addressLocality":"Aggsbach Markt","addressRegion":"Niederösterreich","addressCountry":"AT"},"geo":{"@type":"GeoCoordinates","latitude":48.2945,"longitude":15.4068},"areaServed":[{"@type":"Place","name":"Wachau"},{"@type":"City","name":"Melk"},{"@type":"City","name":"Krems an der Donau"}]}}|tojson }}</script>
<style>
.intl-hero{padding:88px 0 64px;background:linear-gradient(rgba(10,35,29,.38),rgba(10,35,29,.66)),url("/static/images/aggsbach-markt-luftbild.png") center/cover;color:#fff}.intl-wrap{width:min(1120px,92%);margin:auto}.intl-hero h1{max-width:900px;font-size:clamp(38px,6vw,68px);line-height:1.04;margin:10px 0 16px}.intl-hero p{max-width:820px;font-size:21px}.intl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:36px auto}.intl-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.intl-cta{display:inline-block;background:#174f43;color:#fff;text-decoration:none;font-weight:800;padding:14px 20px;border-radius:9px;margin-top:12px}@media(max-width:760px){.intl-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="intl-hero"><div class="intl-wrap"><strong>Zuhause am Bach · Wachau</strong><h1>{{ h1 }}</h1><p>{{ lead }}</p><a class="intl-cta" href="/?lang={{ lang }}#booking">{{ booking }}</a></div></header>
<main class="intl-wrap">
<section class="intl-grid">
{% for item in cards %}<article class="intl-card"><h2>{{ item[0] }}</h2><p>{{ item[1] }}</p></article>{% endfor %}
</section>
<section class="intl-card"><h2>{{ direct_title }}</h2><p>{{ direct_text }}</p><a class="intl-cta" href="/?lang={{ lang }}#booking">{{ booking }}</a></section>
<section class="intl-grid">
<article class="intl-card"><h2>{{ location_title }}</h2><p>{{ location_text }}</p></article>
<article class="intl-card"><h2>{{ language_title }}</h2><p>{{ language_text }}</p></article>
</section>
</main>
</body></html>
